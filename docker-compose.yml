version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FRONTEND_ORIGIN=http://localhost
    volumes:
      - ./backend/polls.db:/app/backend/polls.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
